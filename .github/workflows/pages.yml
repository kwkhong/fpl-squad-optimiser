name: Refresh data, test and deploy website

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download official FPL data and recent histories
        run: node scripts/update-fpl-data.mjs
      - name: Run rolling-origin model backtest
        run: |
          node scripts/backtest-model.mjs
          FPL_BACKTEST_SEASON=2023-24 FPL_EXPORT_CALIBRATION=1 node scripts/backtest-historical.mjs
          node scripts/backtest-historical.mjs
      - name: Test FPL and FXEdge engines
        run: node --test tests/*.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-data
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create and backtest deployable FPL snapshot
        run: |
          node scripts/update-fpl-data.mjs
          node scripts/backtest-model.mjs
          FPL_BACKTEST_SEASON=2023-24 FPL_EXPORT_CALIBRATION=1 node scripts/backtest-historical.mjs
          node scripts/backtest-historical.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Package website with refreshed data
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
